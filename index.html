<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div id ="root"></div>
    
   <script>
    let list = {"name?":"name", "age?":'age', "profession?":"profession","love?": "love", "who?":"who"};
    const root = document.getElementById("root");
    for(let key in list){
        const div = document.createElement("div");

        const btn = document.createElement("button");

        btn.innerText= key;

        const para = document.createElement("p");


        btn.onclick = async function(){
            const url =`testingdeployment-production-092e.up.railway.app/${list[key]}`;

            try{
                const res = await fetch(url);
                const data = await res.json();

                para.innerText = Object.values(data)[0];

            }catch(error){
                console.error(error);
                para.innerText = "Error fetching data";
            };
        }
        div.appendChild(btn);
        div.appendChild(para);
        root.appendChild(div);
    }

    

   
</script>
</body>
</html>
